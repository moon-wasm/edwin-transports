name: Synchronisation Horaire TrucksBook & Convois

on:
  schedule:
    # Toutes les 1 heures
    - cron: '0 * * * *'
  workflow_dispatch: # Déclenchement manuel possible depuis l'interface GitHub

jobs:
  sync-vtc:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Exécution du script de synchronisation
        run: |
          python3 scripts/sync_vtc_data.py

      - name: Commit et Push des nouvelles données si modification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/company_data.json
          if git diff --staged --quiet; then
            echo "Aucune modification détectée sur TrucksBook."
          else
            git commit -m "chore(data): synchronisation automatique TrucksBook [skip ci]"
            git push
          fi
